name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Recreate Android project
        run: flutter create --platforms=android .

      - name: Remove old test files
        run: rm -rf test
      - name: Clean hidden spaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/main.dart")
          s = p.read_text()
          s = s.replace("\u00A0", " ")
          p.write_text(s)
          PY
      - name: Add location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

          """

          if "android.permission.ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", permissions + "<application", 1)

          p.write_text(s)
          PY

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athkari-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
